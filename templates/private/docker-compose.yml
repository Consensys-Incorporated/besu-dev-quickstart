---
x-besu-def:
  &besu-def
  restart: "on-failure"
  image: hyperledger/besu:${BESU_VERSION:-latest}
  env_file:
    - ./config/besu/.env
  entrypoint:
    - /bin/bash
    - -c
    - |

      /opt/besu/bin/besu \
      --config-file=/config/config.toml \
      --p2p-host=$$(hostname -i) ;

x-paladin-def:
  &paladin-def
  image: ghcr.io/lfdt-paladin/paladin:v1.0.0
  restart: "on-failure"
  entrypoint:
    - /bin/sh
    - -c
    - |
      rm -f /app/jna/p.*.sock
      exec java \
        --add-opens java.base/jdk.internal.misc=ALL-UNNAMED \
        --add-opens java.base/sun.nio.ch=ALL-UNNAMED \
        --add-opens java.base/java.nio=ALL-UNNAMED \
        -Dio.netty.tryReflectionSetAccessible=true \
        -Djava.io.tmpdir=/app/jna \
        -Djna.library.path=/app/jna \
        -jar /app/libs/paladin.jar \
        "$@"
    - sh

x-postgres-def:
  &postgres-def
  image: postgres:17.6-alpine
  command: -c 'max_connections=50' -c 'shared_buffers=64MB' -c 'work_mem=2MB' -c 'maintenance_work_mem=16MB'
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

x-postgres-env:
  &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: my-secret


services:

  validator1:
    << : *besu-def
    ports:
      - 21001:8545/tcp
      - 30303
      - 9545
    environment:
      - BESU_IDENTITY=validator1
      - OTEL_RESOURCE_ATTRIBUTES=service.name=validator1,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/validator1:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.11

  validator2:
    << : *besu-def
    ports:
      - 21002:8545/tcp
      - 30303
      - 9545
    environment:
      - BESU_IDENTITY=validator2
      - OTEL_RESOURCE_ATTRIBUTES=service.name=validator2,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/validator2:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.12

  validator3:
    << : *besu-def
    ports:
      - 21003:8545/tcp
      - 30303
      - 9545
    environment:
      - BESU_IDENTITY=validator3
      - OTEL_RESOURCE_ATTRIBUTES=service.name=validator3,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/validator3:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.13

  validator4:
    << : *besu-def
    ports:
      - 21004:8545/tcp
      - 30303
      - 9545
    environment:
      - BESU_IDENTITY=validator4
      - OTEL_RESOURCE_ATTRIBUTES=service.name=validator4,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/validator4:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.14

  rpcnode:
    << : *besu-def
    container_name: rpcnode
    environment:
      - BESU_IDENTITY=rpcnode
      - OTEL_RESOURCE_ATTRIBUTES=service.name=rpcnode,service.version=${BESU_VERSION:-latest}
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/rpcnode:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    ports:
      - 8545:8545/tcp
      - 8546:8546/tcp
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8545'"]
      interval: 5s
      timeout: 5s
      retries: 20      
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.15

  # Besu explorer, reads from rpcnode. validators.json lists each validator's own
  # RPC endpoint so the validators page can propose/discard votes (demo only).
  explorer:
    image: consensys/besu-blockchain-explorer:0.0.2
    container_name: explorer
    environment:
      - BE_RPC_URL=http://rpcnode:8545
      - BE_PUBLIC_RPC_URL=http://localhost:8545
      - DISABLE_AUTH=true
      - NEXTAUTH_URL=http://localhost:25000/explorer/api/auth
    volumes:
      - ./config/besu-blockchain-explorer/validators.json:/config/validators.json:ro
    depends_on:
      rpcnode:
        condition: service_healthy
    ports:
      - 25000:25000/tcp
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.16


{% if privacy %}


  # Deploys the factory contracts before Paladin nodes start for pente, noto and zeto
  # Uses the rpcnode account (config/nodes/rpcnode/accountPrivateKey) at nonce=0,
  # so the factory address is deterministic and hardcoded in each paladin*.yaml.
  paladin-bootstrap:
    image: node:24-alpine
    user: "node"
    depends_on:
      rpcnode:
        condition: service_healthy
    environment:
      - RPC_URL=http://rpcnode:8545
    volumes:
      - ./smart_contracts:/app
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
      - |
        npm install --silent
        npm run compile
        npx ts-node scripts/paladin_bootstrap/deploy_pente_factory.ts
        npx ts-node scripts/paladin_bootstrap/deploy_noto_factory.ts
        npx ts-node scripts/paladin_bootstrap/deploy_zeto_factory.ts
      - sh    
    networks:
      besu-dev-quickstart:



  member1-besu:
    << : *besu-def
    container_name: member1-besu
    environment:
      - BESU_IDENTITY=member1-besu
      - OTEL_RESOURCE_ATTRIBUTES=service.name=member1-besu,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/member1:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.20

  member1-postgres:
    << : *postgres-def
    container_name: member1-postgres    
    environment:
      << : *postgres-env
      POSTGRES_DB: paladin1
    volumes:
      - member1-postgres:/var/lib/postgresql/data
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.21

  paladin1:
    << : *paladin-def
    container_name: paladin1
    depends_on:
      member1-postgres:
        condition: service_healthy
      member1-besu:
        condition: service_started
      paladin-bootstrap:
        condition: service_completed_successfully
    ports:
      - 8548:8548
      - 8549:8549
    volumes:
      - ./config/nodes/member1/paladin/paladin.yaml:/etc/paladin/config.yaml:ro
      - ./config/nodes/member1/paladin/paladin.crt:/etc/paladin/certs/paladin.crt:ro
      - ./config/nodes/member1/paladin/paladin.key:/etc/paladin/certs/paladin.key:ro
    command: ["/etc/paladin/config.yaml", "engine"]
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.22

  member2-besu:
    << : *besu-def
    container_name: member2-besu
    environment:
      - BESU_IDENTITY=member2-besu
      - OTEL_RESOURCE_ATTRIBUTES=service.name=member2-besu,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/member2:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.23

  member2-postgres:
    << : *postgres-def
    container_name: member2-postgres    
    environment:
      << : *postgres-env
      POSTGRES_DB: paladin2
    volumes:
      - member2-postgres:/var/lib/postgresql/data
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.24

  paladin2:
    << : *paladin-def
    container_name: paladin2
    depends_on:
      member2-postgres:
        condition: service_healthy
      member2-besu:
        condition: service_started
      paladin-bootstrap:
        condition: service_completed_successfully
    ports:
      - 8558:8548
      - 8559:8549
    volumes:
      - ./config/nodes/member2/paladin/paladin.yaml:/etc/paladin/config.yaml:ro
      - ./config/nodes/member2/paladin/paladin.crt:/etc/paladin/certs/paladin.crt:ro
      - ./config/nodes/member2/paladin/paladin.key:/etc/paladin/certs/paladin.key:ro
    command: ["/etc/paladin/config.yaml", "engine"]
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.25

  member3-besu:
    << : *besu-def
    container_name: member3-besu
    environment:
      - BESU_IDENTITY=member3-besu
      - OTEL_RESOURCE_ATTRIBUTES=service.name=member3-besu,service.version=${BESU_VERSION:-latest}
    labels:
      - "consensus=besu"
    volumes:
      - ./config/besu/:/config
      - ./config/nodes/member3:/opt/besu/keys
      - ./logs/besu:/tmp/besu
    depends_on:
      - validator1
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.26

  member3-postgres:
    << : *postgres-def
    container_name: member3-postgres
    environment:
      << : *postgres-env
      POSTGRES_DB: paladin3
    volumes:
      - member3-postgres:/var/lib/postgresql/data
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.27

  paladin3:
    << : *paladin-def
    container_name: paladin3
    depends_on:
      member3-postgres:
        condition: service_healthy
      member3-besu:
        condition: service_started
      paladin-bootstrap:
        condition: service_completed_successfully
    ports:
      - 8568:8548
      - 8569:8549
    volumes:
      - ./config/nodes/member3/paladin/paladin.yaml:/etc/paladin/config.yaml:ro
      - ./config/nodes/member3/paladin/paladin.crt:/etc/paladin/certs/paladin.crt:ro
      - ./config/nodes/member3/paladin/paladin.key:/etc/paladin/certs/paladin.key:ro
    command: ["/etc/paladin/config.yaml", "engine"]
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.28

{% endif %}

{% if chainlens %}

  chainlensapi:
    image: web3labs/epirus-free-api:latest
    platform: linux/amd64
    container_name: chainlensapi
    environment:
      - NODE_ENDPOINT=http://rpcnode:8545
      - MONGO_CLIENT_URI=mongodb://chainlensmongodb:27017
      - REINDEX_ENDPOINT=http://chainlensingestion/reindex/
      - MONGO_DB_NAME=epirus
      - MONGO_CREATE_INDICES=true
      - REDIS_HOST=chainlensredis
      - REDIS_PORT=6379
    depends_on:
      - chainlensmongodb
      - chainlensredis
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.51

  chainlensmongodb:
    image: mongo:5.0.8
    platform: linux/amd64
    container_name: chainlensmongodb
    environment:
      - COMPOSE_HTTP_TIMEOUT=900
      - DOCKER_CLIENT_TIMEOUT=900
    entrypoint: mongod --bind_ip "0.0.0.0"    
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.52

  chainlensredis:
    image: redis
    restart: unless-stopped
    container_name: chainlensredis
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.53

  chainlensweb:
    image: web3labs/epirus-free-web:latest
    platform: linux/amd64
    container_name: chainlensweb
    environment:
      - API_URL=/api
      - WS_API_URL=ws://localhost:8090
      - DISPLAY_NETWORK_TAB=disabled
    depends_on:
      - chainlensapi
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.55

  chainlensingestion:
    image: web3labs/epirus-free-ingestion:latest
    platform: linux/amd64
    container_name: chainlensingestion
    environment:
      - NODE_ENDPOINT=http://rpcnode:8545
      - MONGO_CLIENT_URI=mongodb://chainlensmongodb:27017
      - MONGO_DB_NAME=epirus
      - LIST_OF_METRICS_TO_CALCULATE_PER_MINUTE=hourly,daily,monthly,yearly
    depends_on:
      - chainlensmongodb
      - chainlensredis
      - rpcnode
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.54

  chainlensnginx:
    image: nginx:latest
    container_name: chainlensnginx
    volumes:
      - ./config/chainlens/nginx.conf:/etc/nginx/nginx.conf
      - ./config/chainlens/5xx.html:/www/error_pages/5xx.html
    ports:
      - 8081:80
    depends_on:
      - chainlensapi
      - chainlensweb
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.56


{% endif %}

  prometheus:
    image: "prom/prometheus:v3.10.0"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - 9090:9090/tcp
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.32

  grafana:
    image: "grafana/grafana:12.3"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_USERS_VIEWERS_CAN_EDIT=true
    volumes:
      - ./config/grafana/provisioning/:/etc/grafana/provisioning/
      - grafana:/var/lib/grafana
    ports:
      - 3000:3000/tcp
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.33

  loki:
    image: "grafana/loki:3.5.12"
    volumes:
      - ./config/loki/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - 3100:3100/tcp
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.34

  alloy:
    image: "grafana/alloy:latest"
    ports:
      - 12345:12345/tcp
    volumes:
      - ./logs/besu:/var/log/besu:ro
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: 
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.35

{% if otel %}

  otel-agent-downloader:
    image: curlimages/curl:latest
    volumes:
      - ./config/besu/otel:/otel
    command: >-
      -sSfL --create-dirs -o /otel/opentelemetry-javaagent.jar
      https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./config/otel-collector/otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    depends_on:
      - prometheus
      - tempo
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.36

  tempo:
    image: "grafana/tempo:2.6.1"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana datasource)
    networks:
      besu-dev-quickstart:
        ipv4_address: 172.16.239.37

{% endif %}

volumes:
  public-keys:
  prometheus:
  grafana:
  alloy:
  tempo:
  member1-postgres:
  member2-postgres:
  member3-postgres:
  
networks:
  besu-dev-quickstart:
    name: besu-dev-quickstart
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24
